name: Nightly Build

on:
    push:
        branches:
            - main

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
    # The concurrency group contains the workflow name and the branch name.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    build:
        name: Nightly Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Get current tag for HEAD
              run: |
                  echo "CURRENT_TAG=$(git tag --points-at HEAD)" >> $GITHUB_ENV

            # tools: composer, not wp-cli: setup-php's own wp-cli install
            # (tools: wp-cli, or tools: wp-cli:nightly) always goes through
            # its GitHub Releases asset fetcher, and wp-cli doesn't publish
            # a `vnightly` release there — that install fails outright
            # ("Failed to download wp-cli from
            # .../releases/download/vnightly/wp-cli-nightly.phar") rather
            # than falling back to stable. wp-cli's actual nightly builds
            # are only ever hosted at wp-cli/builds' GitHub Pages, fetched
            # directly below instead.
            #
            # github-token: '' — setup-php writes its github-token input into
            # Composer's global, job-wide auth.json while installing tools
            # (to avoid GitHub API rate limits during the install itself).
            # That file persists for the rest of the job, and the value it
            # writes fails Composer's own validation ("invalid characters")
            # — which only surfaces later, the moment something needs that
            # auth. That something is the dist-archive-command install
            # below: `wp package install` registers it as a VCS (git)
            # repository regardless of version, and a VCS clone is exactly
            # when Composer reaches for that token. With none configured, it
            # clones the (public) repo anonymously instead.
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              with:
                  php-version: latest
                  coverage: none
                  tools: composer
                  github-token: ''

            - name: Install WP-CLI (v3 nightly)
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: |
                  curl -sSL -o "${RUNNER_TEMP}/wp-cli.phar" https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli-nightly.phar
                  chmod +x "${RUNNER_TEMP}/wp-cli.phar"
                  sudo mv "${RUNNER_TEMP}/wp-cli.phar" /usr/local/bin/wp
                  wp --version

            # `wp package install` hands the job to Composer, which registers
            # the package as a VCS repository and clones it. Unauthenticated
            # against the GitHub API (see github-token above), Composer reaches
            # for the SSH remote, and the runner has no key — so the clone dies
            # on "Permission denied (publickey)". Rewriting the remote at the
            # git level fixes it wherever Composer's own config happens to
            # live, which for `wp package install` is not the global one.
            - name: Clone GitHub over HTTPS
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: git config --global url."https://github.com/".insteadOf "git@github.com:"

            # :dev-main, not a tagged version: wp-cli nightly is on the
            # unreleased v3 line, and no tagged dist-archive-command release
            # has been updated for it yet — the newest, 3.2.2, still
            # requires wp-cli/wp-cli ^2.13 (itself never actually released).
            # Only the main branch's composer.json requires wp-cli/wp-cli
            # ^3.0, matching what's actually installed here.
            - name: Install latest version of dist-archive-command
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: wp package install wp-cli/dist-archive-command:dev-main

            - name: Setup Node
              uses: actions/setup-node@v7
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install dependencies
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: npm ci

            - name: Build plugin
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: npm run build

            - name: Update version number
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: |
                  CURRENT_DATE=$(date +%Y.%-m.%-d)
                  sed -i -e "s/Version:.*/Version:           0.1.$CURRENT_DATE-${GITHUB_SHA::7}/g" ./public-collaboration.php

            - name: Create updates information
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: |
                  CURRENT_DATE=$(date +%Y.%m.%d)
                  UPDATE=$(cat <<-END
                    {
                        "id": "https://swissspidy.github.io/public-collaboration/update.json",
                        "slug": "public-collaboration",
                        "version": "0.1.$CURRENT_DATE-${GITHUB_SHA::7}",
                        "url": "https://github.com/swissspidy/public-collaboration",
                        "package": "https://swissspidy.github.io/public-collaboration/nightly.zip",
                        "tested": "7.1",
                        "requires_php": "8.0",
                        "autoupdate": true
                    }
                  END

                  )

                  echo $UPDATE > update.json

            - name: Create ZIP file
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: wp dist-archive . ./public-collaboration.zip

            - name: Prepare GitHub Pages
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: |
                  mkdir -p _site
                  mv update.json _site/update.json
                  cp ./public-collaboration.zip _site/nightly.zip

            - name: Upload artifact
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              uses: actions/upload-pages-artifact@v5

            - name: Tag current commit
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: |
                  git config --local user.email "swissspidy@users.noreply.github.com"
                  git config --local user.name "swissspidy-bot"
                  git push origin :refs/tags/nightly
                  git tag -f nightly
                  git push origin --tags

    # Deployment job
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
