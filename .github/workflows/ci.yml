name: CI

on:
    push:
        branches:
            - main
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    js:
        name: JavaScript
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - run: npm run lint:js

            - run: npm run lint:css

            - run: npm run lint:pkg-json

            - run: npm run typecheck

            - run: npm run build

    php:
        name: PHP
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # The lowest version the plugin claims to support, so that anything
            # that would only work on a newer one is caught here rather than by
            # somebody running it.
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.0'
                  coverage: none
                  tools: composer

            - name: Install dependencies
              uses: ramsey/composer-install@v4

            - run: composer lint

            - run: composer phpstan

    test:
        name: Unit tests (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        timeout-minutes: 25

        strategy:
            fail-fast: false
            matrix:
                # The floor the plugin claims, and something current. WordPress
                # itself is pinned to the release this plugin targets, in
                # .wp-env.json, so there is nothing to vary there.
                php: ['8.0', '8.4']

        env:
            WP_ENV_PHP_VERSION: ${{ matrix.php }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: composer

            - name: Install dependencies
              run: npm ci

            - name: Build plugin
              run: npm run build

            - name: Install PHP dependencies
              uses: ramsey/composer-install@v4

            # Coverage only on one leg — Xdebug roughly doubles the run, and one
            # upload per push is all codecov needs.
            - name: Start WordPress
              run: ./node_modules/.bin/wp-env start ${{ matrix.php == '8.4' && '--xdebug=coverage' || '' }}

            - name: Create coverage output directory
              if: ${{ matrix.php == '8.4' }}
              run: mkdir -p artifacts

            # Run wp-env directly: `npm run` swallows `--env-cwd` as an npm config
            # flag, so the plugin directory never reaches wp-env and PHPUnit is
            # looked for in the WordPress root instead.
            - name: Run tests
              run: >-
                  ./node_modules/.bin/wp-env run tests-cli
                  --env-cwd=wp-content/plugins/public-collaboration
                  vendor/bin/phpunit
                  ${{ matrix.php == '8.4' && '--coverage-clover artifacts/coverage.xml' || '' }}

            - name: Upload code coverage report
              uses: codecov/codecov-action@v7.0.0
              if: ${{ matrix.php == '8.4' }}
              with:
                  files: artifacts/coverage.xml
                  token: ${{ secrets.CODECOV_TOKEN }}
